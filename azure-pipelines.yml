
# Laboratorio: integración continua con SonarQube Cloud
# Ejecuta el pipeline cuando se actualiza main o master.
trigger:
  branches:
    include:
      - main
      - master

# Agente propio con Docker Desktop para Testcontainers.
pool:
  name: 'Default'
  demands:
    - Agent.Name -equals KyroSoftt-PC

variables:
  buildConfiguration: 'Release'

steps:
# 1. Obtener el código fuente.
- checkout: self

# 2. Instalar el SDK de .NET 8.
- task: UseDotNet@2
  displayName: 'Instalar .NET 8'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

# 3. Preparar el análisis de SonarQube Cloud.
# La conexión almacena el token de forma segura.
- task: SonarCloudPrepare@4.0.0
  displayName: 'Preparar análisis SonarQube'
  inputs:
    SonarCloud: 'SonarCloud-KyroSoftt'
    organization: 'kyrosoftt'
    scannerMode: 'dotnet'
    projectKey: 'KyroSoftt_Kyro_Group'
    projectName: 'Kyro_Group'
    extraProperties: |
      sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/TestResults/**/coverage.opencover.xml

# 4. Restaurar paquetes NuGet.
- script: dotnet restore SistemaReservasLaboratorios.sln
  displayName: 'Restaurar dependencias'

# 5. Compilar la solución bajo el análisis de SonarQube.
- script: dotnet build SistemaReservasLaboratorios.sln --configuration $(buildConfiguration) --no-restore
  displayName: 'Compilar en Release'


# 6. Ejecutar las pruebas unitarias y de integración.
# Genera resultados TRX y cobertura OpenCover para SonarQube.
- script: >
    dotnet test SistemaReservasLaboratorios.Tests/SistemaReservasLaboratorios.Tests.csproj
    --configuration $(buildConfiguration)
    --no-build
    --logger "trx;LogFileName=resultados.trx"
    --results-directory "$(Agent.TempDirectory)/TestResults"
    --collect:"XPlat Code Coverage"
    -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
  displayName: 'Ejecutar pruebas y generar cobertura'


# 7. Ejecutar análisis estático y enviar métricas.
- task: SonarCloudAnalyze@4.0.0
  displayName: 'Ejecutar análisis SonarQube'

# 8. Publicar resultado del Quality Gate.
- task: SonarCloudPublish@4.0.0
  displayName: 'Publicar Quality Gate'
  inputs:
    pollingTimeoutSec: '300'

# 9. Publicar resultados de pruebas.
- task: PublishTestResults@2
  displayName: 'Publicar resultados de pruebas'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(Agent.TempDirectory)'
    failTaskOnFailedTests: true
    testRunTitle: 'KyroSoftt - $(Build.BuildNumber)'

# 10. Conservar evidencias generadas.
- task: PublishPipelineArtifact@1
  displayName: 'Guardar evidencias de pruebas'
  condition: succeededOrFailed()
  inputs:
    targetPath: '$(Agent.TempDirectory)/TestResults'
    artifact: 'reportes-pruebas'
